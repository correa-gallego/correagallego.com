<svg class="fig" viewBox="0 0 664 404" role="img" aria-labelledby="fk-title fk-desc" preserveAspectRatio="xMidYMid meet"><title id="fk-title">Two regimes of community assembly from one species pool</title><desc id="fk-desc">Two panels over the same pool of nine species, arranged in three groups of three. Each panel crosses three immigration histories against two habitat conditions, giving six local communities. In the upper panel assembly is deterministic: the community that forms follows the habitat condition, and changing the immigration history makes no difference. In the lower panel assembly is historically contingent: the community follows the immigration history instead, and changing the habitat condition makes no difference.</desc><text class="fk__title" x="352" y="8" text-anchor="middle">deterministic assembly</text><text class="fk__row" x="112" y="56.0" text-anchor="end">species pool</text><text class="fk__row" x="112" y="91.0" text-anchor="end">immigration history</text><text class="fk__row" x="112" y="139.0" text-anchor="end">local community</text><text class="fk__row" x="112" y="183.0" text-anchor="end">habitat condition</text><rect class="fk__pool" x="130" y="38" width="498" height="30" rx="15.0" /><circle class="fk__sp" fill="var(--link)" cx="146.0" cy="53.0" r="9.0" /><text class="fk__num" x="146.0" y="56.2" text-anchor="middle">1</text><circle class="fk__sp" fill="var(--link)" cx="204.2" cy="53.0" r="9.0" /><text class="fk__num" x="204.2" y="56.2" text-anchor="middle">2</text><circle class="fk__sp" fill="var(--link)" cx="262.5" cy="53.0" r="9.0" /><text class="fk__num" x="262.5" y="56.2" text-anchor="middle">3</text><circle class="fk__sp" fill="var(--fig-alt)" cx="320.8" cy="53.0" r="9.0" /><text class="fk__num" x="320.8" y="56.2" text-anchor="middle">4</text><circle class="fk__sp" fill="var(--fig-alt)" cx="379.0" cy="53.0" r="9.0" /><text class="fk__num" x="379.0" y="56.2" text-anchor="middle">5</text><circle class="fk__sp" fill="var(--fig-alt)" cx=