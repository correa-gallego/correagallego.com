<svg class="fig" viewBox="0 0 552 396" role="img" aria-labelledby="fk-title fk-desc" preserveAspectRatio="xMidYMid meet"><title id="fk-title">Two regimes of community assembly from one species pool</title><desc id="fk-desc">Two panels over the same pool of nine species, arranged in three groups of three. Each panel crosses three immigration histories against two habitat conditions, giving six local communities. In the upper panel assembly is deterministic and the community that forms follows the habitat condition, so changing the immigration history makes no difference. In the lower panel assembly is historically contingent and the community follows the immigration history instead, so changing the habitat condition makes no difference.</desc><text class="fk__title" x="0" y="14">Deterministic assembly</text><text class="fk__row" x="76" y="54.2" text-anchor="end">Species</text><text class="fk__row" x="76" y="64.6" text-anchor="end">pool</text><text class="fk__row" x="76" y="92.2" text-anchor="end">Immigration</text><text class="fk__row" x="76" y="102.6" text-anchor="end">history</text><text class="fk__row" x="76" y="138.2" text-anchor="end">Local</text><text class="fk__row" x="76" y="148.6" text-anchor="end">community</text><text class="fk__row" x="76" y="180.2" text-anchor="end">Habitat</text><text class="fk__row" x="76" y="190.6" text-anchor="end">condition</text><rect class="fk__pool" x="86" y="40" width="450" height="32" rx="16.0" /><circle class="fk__sp" fill="var(--link)" cx="125.0" cy="56.0" r="10.4" /><text class="fk__num" x="125.0" y="59.7" text-anchor="middle">1</text><circle class="fk__sp" fill="var(--link)" cx="159.0" cy="56.0" r="10.4" /><text class="fk__num" x="159.0" y="59.7" text-anchor="middle">2</text><circle class="fk__sp" fill="var(--link)" cx="193.0" cy="56.0" r="10.4" /><text class="fk__num" x="193.0" y="59.7" text-anchor="middle">3</text><circle class="fk__sp" fill="var(--fig-alt)" cx="277.0" cy="56.0" r="10.4" /><text class="fk__num" x="277.0" 