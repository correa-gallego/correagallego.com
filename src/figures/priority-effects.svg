<svg class="fig" viewBox="0 0 568 430" role="img" aria-labelledby="fk-title fk-desc" preserveAspectRatio="xMidYMid meet"><title id="fk-title">Two regimes of community assembly from one species pool</title><desc id="fk-desc">Two panels over the same pool of nine species, which fall into three guilds of three. Colour marks the species and shape marks the guild, so every local community holds one species of each guild and is written out beneath as a set of three numbers. Each panel crosses three immigration histories against two habitat conditions, giving six local communities. In the upper panel assembly is deterministic and the community that forms follows the habitat condition, so changing the immigration history makes no difference. In the lower panel assembly is historically contingent and the community follows the immigration history instead, so changing the habitat condition makes none.</desc><text class="fk__title" x="0" y="14">Deterministic assembly</text><text class="fk__row" x="66" y="55.2" text-anchor="end">Species</text><text class="fk__row" x="66" y="67.6" text-anchor="end">pool</text><text class="fk__row" x="66" y="107.2" text-anchor="end">Immigration</text><text class="fk__row" x="66" y="119.6" text-anchor="end">history</text><text class="fk__row" x="66" y="157.2" text-anchor="end">Local</text><text class="fk__row" x="66" y="169.6" text-anchor="end">community</text><text class="fk__row" x="66" y="199.2" text-anchor="end">Habitat</text><text class="fk__row" x="66" y="211.6" text-anchor="end">condition</text><rect class="fk__pool" x="78.0" y="40" width="474.0" height="44" rx="22.0" /><polygon class="fk__sp" fill="var(--sp1)" points="167.00,46.56 178.17,65.90 155.83,65.90" /><text class="fk__key" x="167.0" y="78" text-anchor="middle">1</text><circle class="fk__sp" fill="var(--sp2)" cx="197.00" cy="58.00" r="9.57" /><text class="fk__key" x="197.0" y="78" text-anchor="middle">2</text><polygon class="fk__sp" fill="var(--sp3)" points="227.00,46.98 229.75,54.21