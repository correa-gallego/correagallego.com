<svg class="fig" viewBox="0 0 452 196" role="img" aria-labelledby="pe-title pe-desc" preserveAspectRatio="xMidYMid meet"><title id="pe-title">The same three strains, two arrival orders, two communities</title><desc id="pe-desc">A schematic. On the left, a pool of six strains drawn as six different symbols. Two rows run to the right. Each row shows the same three strains arriving in a different order, then the community that results. Each community keeps the strain that arrived first, so the two communities differ although the pool and the conditions are the same.</desc><text class="pe__head" x="54" y="46" text-anchor="middle">species pool</text><text class="pe__head" x="163" y="46" text-anchor="middle">arrival order</text><text class="pe__head" x="291" y="46" text-anchor="middle">community</text><circle class="pe__pool" cx="54" cy="104" r="40" /><circle class="pe__mark" fill="var(--link)" cx="34.0" cy="88.0" r="3.5" /><rect class="pe__mark" fill="var(--link)" x="56.5" y="78.5" width="7.0" height="7.0" rx="0.8" /><polygon class="pe__mark" fill="var(--link)" points="78.0,97.9 82.1,105.4 73.9,105.4" /><circle class="pe__mark" fill="var(--paper)" cx="30.0" cy="112.0" r="3.5" /><rect class="pe__mark" fill="var(--paper)" x="48.5" y="106.5" width="7.0" height="7.0" rx="0.8" /><polygon class="pe__mark" fill="var(--paper)" points="70.0,119.9 74.1,127.4 65.9,127.4" /><path class="pe__arrow" d="M100.0,78.0 H124.0 M120.0,75.4 L124.0,78.0 L120.0,80.6" /><circle class="pe__mark" fill="var(--link)" cx="136.0" cy="78.0" r="3.5" /><path class="pe__arrow" d="M142.0,78.0 H157.0 M153.0,75.4 L157.0,78.0 L153.0,80.6" /><rect class="pe__mark" fill="var(--paper)" x="159.5" y="74.5" width="7.0" height="7.0" rx="0.8" /><path class="pe__arrow" d="M169.0,78.0 H184.0 M180.0,75.4 L184.0,78.0 L180.0,80.6" /><polygon class="pe__mark" fill="var(--link)" points="190.0,73.9 194.1,81.4 185.9,81.4" /><path class="pe__arrow" d="M200.0,78.0 H244.0 M240.0,75.4 L244.0,78.0 L240.0,80.6" /><rect class="pe__b