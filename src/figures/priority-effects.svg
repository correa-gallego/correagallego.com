<svg class="fig" viewBox="0 0 452 226" role="img" aria-labelledby="pe-title pe-desc" preserveAspectRatio="xMidYMid meet"><title id="pe-title">The same three strains, two arrival orders, two communities</title><desc id="pe-desc">A schematic. On the left, a pool of six strains drawn as six different symbols. Two rows run to the right. Each row shows the same three strains arriving in a different order, then the community that results. Each community keeps the strain that arrived first, so the two communities differ although the pool and the conditions are the same.</desc><text class="pe__head" x="54" y="50" text-anchor="middle">species pool</text><text class="pe__head" x="163" y="50" text-anchor="middle">arrival order</text><text class="pe__head" x="291" y="50" text-anchor="middle">community</text><circle class="pe__pool" cx="54" cy="120" r="42" /><circle class="pe__mark" fill="var(--link)" cx="34.0" cy="104.0" r="3.5" /><rect class="pe__mark" fill="var(--link)" x="56.5" y="94.5" width="7.0" height="7.0" rx="0.8" /><polygon class="pe__mark" fill="var(--link)" points="78.0,113.9 82.1,121.4 73.9,121.4" /><circle class="pe__mark" fill="var(--paper)" cx="30.0" cy="128.0" r="3.5" /><rect class="pe__mark" fill="var(--paper)" x="48.5" y="122.5" width="7.0" height="7.0" rx="0.8" /><polygon class="pe__mark" fill="var(--paper)" points="70.0,135.9 74.1,143.4 65.9,143.4" /><path class="pe__arrow" d="M102.0,88.0 H124.0 M120.0,85.4 L124.0,88.0 L120.0,90.6" /><circle class="pe__mark" fill="var(--link)" cx="136.0" cy="88.0" r="3.5" /><path class="pe__arrow" d="M142.0,88.0 H157.0 M153.0,85.4 L157.0,88.0 L153.0,90.6" /><rect class="pe__mark" fill="var(--paper)" x="159.5" y="84.5" width="7.0" height="7.0" rx="0.8" /><path class="pe__arrow" d="M169.0,88.0 H184.0 M180.0,85.4 L184.0,88.0 L180.0,90.6" /><polygon class="pe__mark" fill="var(--link)" points="190.0,83.9 194.1,91.4 185.9,91.4" /><path class="pe__arrow" d="M200.0,88.0 H244.0 M240.0,85.4 L244.0,88.0 L240.0,90.6" /><rect class="pe_