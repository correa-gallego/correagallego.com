<svg class="fig" viewBox="0 0 566 283" role="img" aria-labelledby="pe-title pe-desc" preserveAspectRatio="xMidYMid meet"><title id="pe-title">Niche preemption, and why arrival order changes the community</title><desc id="pe-desc">A schematic. On the left, a pool of six strains drawn as three shapes, two strains of each, one blue and one amber. Shape denotes the guild whose niche a strain can occupy. Three niches are vacant to begin with, one per guild. Two rows follow, holding the arriving strains constant and changing only their order. In each row the first strain of a guild to arrive takes that guild's niche, so the later competitor is excluded and the two resulting communities differ in one niche. The square niche stays vacant in both, because no strain of that guild arrived.</desc><text class="pe__head" x="70" y="44" text-anchor="middle">species pool</text><text class="pe__head" x="182" y="44" text-anchor="middle">niches</text><text class="pe__head" x="314" y="44" text-anchor="middle">arrival order</text><text class="pe__head" x="480" y="44" text-anchor="middle">community</text><circle class="pe__pool" cx="70" cy="158" r="50" /><circle class="pe__mark" fill="var(--link)" cx="46.0" cy="136.0" r="5.5" /><circle class="pe__mark" fill="var(--fig-alt)" cx="78.0" cy="130.0" r="5.5" /><rect class="pe__mark" fill="var(--link)" x="92.5" y="146.5" width="11.0" height="11.0" rx="1.1" /><rect class="pe__mark" fill="var(--fig-alt)" x="34.5" y="158.5" width="11.0" height="11.0" rx="1.1" /><polygon class="pe__mark" fill="var(--link)" points="66.0,163.4 72.9,175.3 59.1,175.3" /><polygon class="pe__mark" fill="var(--fig-alt)" points="92.0,173.4 98.9,185.3 85.1,185.3" /><circle class="pe__niche" cx="182.0" cy="124.0" r="8.2" /><rect class="pe__niche" x="173.8" y="149.8" width="16.5" height="16.5" rx="1.1" /><polygon class="pe__niche" points="182.0,182.1 192.4,199.9 171.6,199.9" /><path class="pe__arrow" d="M204.0,112.0 H252.0 M247.0,108.8 L252.0,112.0 L247.0,115.2" /><circle class="pe__mark" fill="var(--link)" cx="268.0" cy="112.0" r="5.5" /><path class="pe__arrow" d="M277.0,112.0 H305.0 M300.0,108.8 L305.0,112.0 L300.0,115.2" /><polygon class="pe__mark" fill="var(--link)" points="314.0,105.4 320.9,117.3 307.1,117.3" /><path class="pe__arrow" d="M323.0,112.0 H351.0 M346.0,108.8 L351.0,112.0 L346.0,115.2" /><circle class="pe__mark pe__mark--faded" fill="var(--fig-alt)" cx="360.0" cy="112.0" r="5.5" /><path class="pe__arrow" d="M373.0,112.0 H398.0 M393.0,108.8 L398.0,112.0 L393.0,115.2" /><rect class="pe__box" x="410" y="82.0" width="140" height="60" rx="4" /><circle class="pe__niche" cx="445.0" cy="112.0" r="8.2" /><circle class="pe__mark" fill="var(--link)" cx="445.0" cy="112.0" r="5.5" /><rect class="pe__niche" x="471.8" y="103.8" width="16.5" height="16.5" rx="1.1" /><polygon class="pe__niche" points="515.0,102.1 525.4,119.9 504.6,119.9" /><polygon class="pe__mark" fill="var(--link)" points="515.0,105.4 521.9,117.3 508.1,117.3" /><path class="pe__arrow" d="M204.0,218.0 H252.0 M247.0,214.8 L252.0,218.0 L247.0,221.2" /><circle class="pe__mark" fill="var(--fig-alt)" cx="268.0" cy="218.0" r="5.5" /><path class="pe__arrow" d="M277.0,218.0 H305.0 M300.0,214.8 L305.0,218.0 L300.0,221.2" /><polygon class="pe__mark" fill="var(--link)" points="314.0,211.4 320.9,223.3 307.1,223.3" /><path class="pe__arrow" d="M323.0,218.0 H351.0 M346.0,214.8 L351.0,218.0 L346.0,221.2" /><circle class="pe__mark pe__mark--faded" fill="var(--link)" cx="360.0" cy="218.0" r="5.5" /><path class="pe__arrow" d="M373.0,218.0 H398.0 M393.0,214.8 L398.0,218.0 L393.0,221.2" /><rect class="pe__box" x="410" y="188.0" width="140" height="60" rx="4" /><circle class="pe__niche" cx="445.0" cy="218.0" r="8.2" /><circle class="pe__mark" fill="var(--fig-alt)" cx="445.0" cy="218.0" r="5.5" /><rect class="pe__niche" x="471.8" y="209.8" width="16.5" height="16.5" rx="1.1" /><polygon class="pe__niche" points="515.0,208.1 525.4,225.9 504.6,225.9" /><polygon class="pe__mark" fill="var(--link)